# Delta Lake is the format of every table, as in Databricks, and the
# warehouse is a bucket of the MinIO server beside this one.
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.sources.default                    delta
# Spark 3 makes a Hive text table of a plain CREATE TABLE unless told not
# to; with this off, the table is of the default format above.
spark.sql.legacy.createHiveTableByDefault    false
spark.sql.warehouse.dir                      s3a://lakehouse/warehouse

spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.access.key               lakehouse
spark.hadoop.fs.s3a.secret.key               lakehouse-secret

# One small machine: one partition, no web UI.
spark.sql.shuffle.partitions                 1
spark.databricks.delta.snapshotPartitions    1
spark.ui.enabled                             false
