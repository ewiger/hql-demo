# A NATS server with JetStream beside an open-source lakehouse: a Spark
# Thrift Server that keeps Delta Lake tables in a MinIO bucket. Two
# one-shot containers create the stream and the bucket. The host reaches
# NATS on localhost:54222 and the SQL endpoint on localhost:50001.
name: hql-demo-nats-lakehouse

services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "54222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  streams:
    image: natsio/nats-box:0.18.0
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - nats --server nats://nats:4222 stream add ORDERS --subjects 'orders.>' --defaults
    restart: "no"

  # MinIO publishes no image of its own any longer; this is Chainguard's
  # build of the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: ["server", "/tmp/data"]
    environment:
      MINIO_ROOT_USER: lakehouse
      MINIO_ROOT_PASSWORD: lakehouse-secret
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  buckets:
    image: cgr.dev/chainguard/minio:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set lake http://minio:9000 lakehouse lakehouse-secret && mc mb --ignore-existing lake/lakehouse
    restart: "no"

  # The image of the lakehouse use case: Spark, Delta Lake, the S3 connector.
  spark:
    build: ../lakehouse/spark
    image: hql-demo-spark-delta:3.5.6
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "50001:10001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10001'"]
      interval: 3s
      timeout: 5s
      retries: 60
