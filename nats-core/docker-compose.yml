# One NATS server, without JetStream: core NATS keeps no message, so a
# subscriber is given what is published while it is subscribed. The host
# reaches the server on localhost:54223.
name: hql-demo-nats-core

services:
  nats:
    image: nats:2.11-alpine
    command: ["-m", "8222"]
    ports:
      - "54223:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
