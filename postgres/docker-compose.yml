# One PostgreSQL server. The host reaches it on localhost:55432; the
# database starts empty, and the programs create the table they write.
name: hql-demo-postgres

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: hql
      POSTGRES_PASSWORD: hql
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hql -d demo"]
      interval: 2s
      timeout: 5s
      retries: 30
